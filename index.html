<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CARDY">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CARDY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    color: #c9d1d9;
    font-family: 'Consolas', 'Courier New', monospace;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    padding-top: env(safe-area-inset-top, 8px);
    padding-bottom: env(safe-area-inset-bottom, 8px);
  }
  .term {
    background: #000;
    border: 1px solid #30363d;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(88,166,255,0.15);
    padding: 10px;
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    overflow: hidden;
    font-size: 10px;
    line-height: 1.3;
    white-space: pre;
    color: #8b949e;
  }
  .term .line { min-height: 1em; }

  .mini-term {
    position: fixed;
    width: 68vw;
    height: 110px;
    background: #000;
    border: 1px solid #30363d;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.7);
    font-family: 'Consolas', monospace;
    font-size: 9px;
    color: #8b949e;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity .15s ease, transform .15s ease;
    z-index: 10;
    pointer-events: none; /* لمس روش اثری نداره */
  }
  .mini-term.show { opacity: 1; transform: scale(1); }
  .mini-term .bar {
    height: 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 6px;
    font-size: 9px;
    color: #8b949e;
  }
  .mini-term .body { padding: 6px; }
  .mini-term .prompt { color: #58a6ff; }

  @media (min-width: 600px) {
    .term { font-size: 12px; padding: 14px; }
    .mini-term { width: 260px; height: 170px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="term" id="mainTerm">
    <div class="line" style="color:#58a6ff;">> INITIALIZING...</div>
  </div>
</div>
<div id="minis"></div>

<script>
(function(){
  // ---------- جلوگیری از زوم و منوی راست‌کلیک ----------
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---------- جلوگیری از دکمه Back مرورگر ----------
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function(){
    history.pushState(null, '', location.href);
  });

  const term = document.getElementById('mainTerm');
  const container = document.getElementById('minis');

  // ---------- تعداد پنجره‌ها ----------
  const TOTAL = 30;        // کل پنجره‌ها (۱ اصلی + بقیه)
  const INTERVAL = 180;    // سرعت باز شدن (میلی‌ثانیه) - کمتر = سریع‌تر

  const minis = [];
  let spawned = 0;

  // ---------- نمایش متن‌های خالی داخل پنجره اصلی (بدون شکل) ----------
  const lines = [
    "> STARTING SYSTEM...",
    "> LOADING MODULES...",
    "> [OK] NETWORK",
    "> [OK] DATABASE",
    "> [OK] SECURITY",
    "> SYSTEM CORRUPTED [!!]",
    "> OPENING TERMINALS..."
  ];
  lines.forEach((t, i) => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = 'line';
      d.style.color = (t.includes('CORRUPTED') ? '#f85149' : '#8b949e');
      d.textContent = t;
      term.appendChild(d);
    }, i * 120);
  });

  // ---------- باز کردن پنجره‌ها بلافاصله ----------
  function spawnMinis(){
    let i = 0;
    const timer = setInterval(() => {
      if (i >= TOTAL - 1) { clearInterval(timer); return; }
      i++;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const ww = w * 0.68;
      const wh = 110;
      const maxX = Math.max(0, w - ww);
      const maxY = Math.max(0, h - wh);
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      const el = document.createElement('div');
      el.className = 'mini-term';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.innerHTML = `
        <div class="bar"><span>Terminal ${i+1}</span></div>
        <div class="body">
          <div><span class="prompt">C:\\&gt;</span> _</div>
        </div>
      `;
      container.appendChild(el);
      minis.push(el);
      requestAnimationFrame(() => el.classList.add('show'));
      spawned++;
    }, INTERVAL);
  }

  // شروع بلافاصله بعد از ۳۰۰ms (که متن‌های اولیه ظاهر بشن)
  setTimeout(spawnMinis, 300);

  // ---------- راه خروج مخفی: سه بار لمس گوشه بالا-چپ ----------
  let tapCount = 0;
  let tapTimer = null;
  document.addEventListener('touchstart', function(e){
    const t = e.touches[0];
    if (t.clientX < 60 && t.clientY < 60) {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 800);
      if (tapCount >= 3) {
        tapCount = 0;
        // خروج کامل
        minis.forEach(m => m.remove());
        minis.length = 0;
        document.body.innerHTML = '<div style="color:#0f0;font-family:monospace;padding:20px;text-align:center;margin-top:40vh;font-size:16px;">EXIT OK ✅</div>';
      }
    }
  }, { passive: true });

  // ---------- ثبت Service Worker ----------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
