<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CARDY">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CARDY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    color: #c9d1d9;
    font-family: 'Consolas', 'Courier New', monospace;
    height: 100%;
    overflow: hidden;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    padding-top: env(safe-area-inset-top, 8px);
    padding-bottom: env(safe-area-inset-bottom, 8px);
  }
  .term {
    background: #000;
    border: 1px solid #30363d;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(88,166,255,0.15);
    padding: 10px;
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    overflow: auto;
    font-size: 9px;
    line-height: 1.15;
    white-space: pre;
    color: #c9d1d9;
  }
  .term::-webkit-scrollbar { display: none; }
  .term .line { min-height: 1em; }
  .cursor {
    display: inline-block;
    width: 6px;
    height: 11px;
    background: #c9d1d9;
    animation: blink 1s steps(1) infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .mini-term {
    position: fixed;
    width: 68vw;
    height: 110px;
    background: #000;
    border: 1px solid #30363d;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.7);
    font-family: 'Consolas', monospace;
    font-size: 9px;
    color: #8b949e;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity .18s ease, transform .18s ease;
    z-index: 10;
  }
  .mini-term.show { opacity: 1; transform: scale(1); }
  .mini-term .bar {
    height: 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px;
    font-size: 9px;
    color: #8b949e;
  }
  .mini-term .bar .x {
    cursor: pointer;
    color: #f85149;
    font-weight: bold;
    padding: 0 6px;
    font-size: 12px;
  }
  .mini-term .body { padding: 6px; }
  .mini-term .prompt { color: #58a6ff; }

  @media (min-width: 600px) {
    .term { font-size: 12px; padding: 14px; }
    .mini-term { width: 260px; height: 170px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="term" id="mainTerm"></div>
</div>
<div id="minis"></div>

<script>
(function(){
  // جلوگیری از زوم دو انگشتی
  document.addEventListener('gesturestart', e => e.preventDefault());

  const art = [
    "",
    "   +==============================================+",
    "   |                                              |",
    "   |   ####    ###   ####   ####   #   #          |",
    "   |   #   #  #   #  #   #  #   #   # #           |",
    "   |   ####   #####  ####   ####     #            |",
    "   |   #   #  #   #  #   #  #   #    #            |",
    "   |   #   #  #   #  #   #  #   #    #            |",
    "   |   ####   #   #  ####   ####     #            |",
    "   |                                              |",
    "   +==============================================+",
    "",
    "      ............................................",
    "    ..::::::::::::::::::::::::::::::::::::::::::::..",
    "   .::::::::::::::::::::::::::::::::::::::::::::::..",
    "   .::##############################################::.",
    "   .::#  ########################################  #::.",
    "   .::#  ##  ##################################  ##  #::.",
    "   .::#  ##  ##  ##########################  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##################   ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##   ##########   ##   ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##   ##  ####  ##   ##   ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##   ##  ##  ##   ##   ##  ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##   ##  ##  ##   ##   ##  ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##   ##########   ##   ##  ##  ##  ##  #::.",
    "   .::#  ##  ##  ##   ##################   ##   ##  ##  ##  #::.",
    "   .::#  ##  ##  ##########################   ##  ##  ##  #::.",
    "   .::#  ##  ##################################  ##  #::.",
    "   .::#  ########################################  #::.",
    "   .::##############################################::.",
    "    ..::::::::::::::::::::::::::::::::::::::::::::..",
    "      ............................................",
    "",
    "   +==============================================+",
    "   |  [!!] WARNING: SYSTEM CORRUPTED [!!]         |",
    "   |  [>>] FILE: clown.exe                        |",
    "   |  [>>] STATUS: INFECTED                       |",
    "   |  [>>] USER: UNKNOWN                          |",
    "   |  [>>] PRESS ANY KEY TO CONTINUE...           |",
    "   +==============================================+",
    ""
  ];

  const term = document.getElementById('mainTerm');
  let lineIdx = 0;

  function printNextLine(){
    if (lineIdx >= art.length) { startCountdown(); return; }
    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = art[lineIdx];
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
    lineIdx++;
    setTimeout(printNextLine, 55);
  }

  function startCountdown(){
    let sec = 5;
    const div = document.createElement('div');
    div.className = 'line';
    div.style.color = '#58a6ff';
    term.appendChild(div);
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    term.appendChild(cursor);

    function tick(){
      div.textContent = `> SYSTEM LOCKED. CONTINUING IN ${sec}...`;
      if (sec <= 0) { cursor.remove(); spawnMinis(); return; }
      sec--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  const TOTAL = 10;
  const minis = [];

  function spawnMinis(){
    const container = document.getElementById('minis');
    let i = 0;
    const timer = setInterval(() => {
      if (i >= TOTAL - 1) { clearInterval(timer); return; }
      i++;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const ww = w * 0.68;
      const wh = 110;
      const maxX = Math.max(0, w - ww);
      const maxY = Math.max(0, h - wh);
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      const el = document.createElement('div');
      el.className = 'mini-term';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.innerHTML = `
        <div class="bar">
          <span>Terminal ${i+1}</span>
          <span class="x">✕</span>
        </div>
        <div class="body">
          <div><span class="prompt">C:\\&gt;</span> _</div>
        </div>
      `;
      el.querySelector('.x').addEventListener('click', (e) => {
        e.stopPropagation();
        closeAll();
      });
      container.appendChild(el);
      minis.push(el);
      requestAnimationFrame(() => el.classList.add('show'));
    }, 300);
  }

  function closeAll(){
    minis.forEach(m => { m.style.opacity = '0'; m.style.transform = 'scale(0.8)'; });
    setTimeout(() => {
      minis.forEach(m => m.remove());
      minis.length = 0;
      term.innerHTML = '';
      lineIdx = 0;
      printNextLine();
    }, 250);
  }

  document.getElementById('stage').addEventListener('click', () => {
    if (minis.length > 0) closeAll();
  });

  printNextLine();

  // ثبت Service Worker برای PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
